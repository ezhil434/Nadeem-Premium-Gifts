<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nadeem - Special Gift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 min-height:100vh;display:flex;justify-content:center;align-items:center;
 overflow:hidden;font-family:Arial,sans-serif;color:#fff;
 background:linear-gradient(135deg,#16002b,#6a006f,#d4145a);
}
#confetti{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;width:8px;height:18px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
.card{
 position:relative;width:min(92vw,430px);padding:34px;border-radius:28px;
 text-align:center;background:rgba(255,255,255,.12);
 backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.75);
 box-shadow:0 0 18px rgba(255,255,255,.35),0 0 50px rgba(255,64,129,.5),0 25px 45px rgba(0,0,0,.35);
 animation:glow 2.5s ease-in-out infinite alternate;
}
@keyframes glow{
 from{box-shadow:0 0 18px rgba(255,255,255,.35),0 0 40px rgba(255,64,129,.4),0 25px 45px rgba(0,0,0,.35)}
 to{box-shadow:0 0 30px rgba(255,255,255,.65),0 0 75px rgba(234,128,252,.7),0 25px 45px rgba(0,0,0,.45)}
}
.gift{
 font-size:88px;display:inline-block;
 filter:drop-shadow(0 0 10px rgba(255,215,0,.95)) drop-shadow(0 0 25px rgba(255,64,129,.9));
 animation:bounce 1.6s infinite ease-in-out;
}
@keyframes bounce{50%{transform:translateY(-10px) scale(1.08)}}
h1{margin:18px 0 10px;font-size:2.2rem;letter-spacing:1px}
p{margin-bottom:28px}
.btn{
 display:inline-block;padding:18px 34px;border-radius:999px;
 background:linear-gradient(90deg,#ff4081,#d500f9);
 border:3px solid rgba(255,255,255,.9);color:#fff;text-decoration:none;
 font-size:20px;font-weight:bold;
 box-shadow:0 0 18px #ff4081,0 0 40px #d500f9;
}
</style>
</head>
<body>
<div id="confetti"></div>
<div class="card">
 <div class="gift">🎁</div>
 <h1>SPECIAL GIFT</h1>
 <p>A special gift for you from Nadeem.</p>
 <a class="btn" href="https://linkthem.net/aff_c?offer_id=1548&aff_id=199750" target="_blank" rel="noopener noreferrer">Click Here To Claim</a>
</div>
<script>
const colors=["#fff","#ff4081","#ea80fc","#ffd54f","#69f0ae","#40c4ff"];
const c=document.getElementById("confetti");
for(let i=0;i<120;i++){
 let d=document.createElement("div");d.className="p";
 d.style.left=Math.random()*100+"vw";
 d.style.background=colors[Math.floor(Math.random()*colors.length)];
 d.style.animationDuration=(4+Math.random()*4)+"s";
 d.style.animationDelay=Math.random()*5+"s";
 c.appendChild(d);
}
</script>
</body>
</html>
